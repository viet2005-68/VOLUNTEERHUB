spring:
  application:
    name: DonationService

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donations}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8088}

vnpay:
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/donations/vnpay/return}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/donations/vnpay/ipn}
  mobile-return-url: ${VNPAY_MOBILE_RETURN_URL:volunteerhub://donations/vnpay-return}
