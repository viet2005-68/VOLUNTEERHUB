name: Deploy VolunteerHub

on:
  push:
    branches:
      - cicd
    paths-ignore:
      - "Frontend/**"
      - "README_CICD.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: viet2005-68
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: volunteerhub-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: volunteerhub-service-discovery
            service_dir: ServiceDiscovery
            kind: spring
          - image: volunteerhub-api-gateway
            service_dir: ApiGateway
            kind: spring
          - image: volunteerhub-authorization-server
            service_dir: AuthorizationServer
            kind: spring
          - image: volunteerhub-user-service
            service_dir: UserService
            kind: spring
          - image: volunteerhub-event-service
            service_dir: EventService
            kind: spring
          - image: volunteerhub-community-service
            service_dir: CommunityService
            kind: spring
          - image: volunteerhub-registration-service
            service_dir: RegistrationService
            kind: spring
          - image: volunteerhub-notification-service
            service_dir: NotificationService
            kind: spring
          - image: volunteerhub-chat-service
            service_dir: ChatService
            kind: spring
          - image: volunteerhub-aggregation-service
            service_dir: AggregationService
            kind: spring
          - image: volunteerhub-analytic-service
            service_dir: AnalyticService
            kind: spring
          - image: volunteerhub-frontend
            service_dir: Frontend
            kind: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          ref: ${{ github.ref }}

      - name: Resolve deploy metadata
        shell: bash
        run: |
          echo "DEPLOY_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Resolve public URL
        id: public-url
        shell: bash
        run: |
          if [ -n "${{ vars.PUBLIC_BASE_URL }}" ]; then
            echo "value=${{ vars.PUBLIC_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=http://${{ secrets.VM_HOST }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Spring image
        if: matrix.kind == 'spring'
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}"
          docker build \
            --platform linux/amd64 \
            -f docker/spring-service.Dockerfile \
            --build-arg "SERVICE_DIR=${{ matrix.service_dir }}" \
            -t "${IMAGE}:${DEPLOY_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${DEPLOY_SHA}"
          docker push "${IMAGE}:latest"

      - name: Build and push frontend image
        if: matrix.kind == 'frontend'
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}"
          docker build \
            --platform linux/amd64 \
            -f Frontend/Dockerfile \
            --build-arg VITE_API_URL=/api \
            --build-arg "VITE_API_LOGIN=${{ steps.public-url.outputs.value }}" \
            --build-arg VITE_AUTH_BASE_URL= \
            --build-arg "VITE_PUBLIC_BASE_URL=${{ steps.public-url.outputs.value }}" \
            --build-arg VITE_OAUTH_RESPONSE_TYPE=code \
            --build-arg "VITE_OAUTH_CLIENT_ID=${{ secrets.CLIENT_ID }}" \
            --build-arg "VITE_OAUTH_CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" \
            --build-arg VITE_OAUTH_SCOPE=openid \
            --build-arg "VITE_OAUTH_REDIRECT_URI=${{ steps.public-url.outputs.value }}/login/oauth2/code/volunteerhub" \
            --build-arg "VITE_GG_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
            --build-arg "VITE_GG_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --build-arg "VITE_GOOGLE_REDIRECT_URI=${{ steps.public-url.outputs.value }}/login/oauth2/code/google" \
            -t "${IMAGE}:${DEPLOY_SHA}" \
            -t "${IMAGE}:latest" \
            Frontend
          docker push "${IMAGE}:${DEPLOY_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          ref: ${{ github.ref }}

      - name: Resolve deploy metadata
        shell: bash
        run: |
          echo "DEPLOY_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Install kubectl and Helm
        shell: bash
        run: |
          set -euo pipefail
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          kubectl version --client
          helm version

      - name: Prepare kubeconfig and SSH tunnel
        shell: bash
        run: |
          mkdir -p ~/.kube ~/.ssh
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" | tr -d '\r' > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vm_key -fN \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -L 6443:127.0.0.1:6443 \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}"
          kubectl get nodes

      - name: Patch deployment config
        shell: bash
        run: |
          PUBLIC_BASE_URL="${{ vars.PUBLIC_BASE_URL }}"
          if [ -z "$PUBLIC_BASE_URL" ]; then
            PUBLIC_BASE_URL="http://${{ secrets.VM_HOST }}"
          fi
          APP_HOST="${PUBLIC_BASE_URL#http://}"
          APP_HOST="${APP_HOST#https://}"
          APP_HOST="${APP_HOST%%/*}"
          FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}"
          FIREBASE_STORAGE_BUCKET="${{ vars.FIREBASE_STORAGE_BUCKET }}"
          VAPID_SUBJECT="${{ vars.VAPID_SUBJECT }}"
          if [ -z "$VAPID_SUBJECT" ]; then
            VAPID_SUBJECT="mailto:admin@volunteerhub.local"
          fi
          LETSENCRYPT_EMAIL="${{ vars.LETSENCRYPT_EMAIL }}"
          if [ -z "$LETSENCRYPT_EMAIL" ]; then
            LETSENCRYPT_EMAIL="${VAPID_SUBJECT#mailto:}"
          fi
          sed -i "s|__PUBLIC_BASE_URL__|${PUBLIC_BASE_URL}|g" k8s/overlays/prod-lite/config-patch.yaml
          sed -i "s|__FIREBASE_PROJECT_ID__|${FIREBASE_PROJECT_ID}|g" k8s/overlays/prod-lite/config-patch.yaml
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${FIREBASE_STORAGE_BUCKET}|g" k8s/overlays/prod-lite/config-patch.yaml
          sed -i "s|__VAPID_SUBJECT__|${VAPID_SUBJECT}|g" k8s/overlays/prod-lite/config-patch.yaml
          sed -i "s|__APP_HOST__|${APP_HOST}|g" k8s/overlays/prod-lite/ingress.yaml
          sed -i "s|__LETSENCRYPT_EMAIL__|${LETSENCRYPT_EMAIL}|g" k8s/overlays/prod-lite/cluster-issuer.yaml
          sed -i "s|newTag: latest|newTag: ${DEPLOY_SHA}|g" k8s/overlays/prod-lite/kustomization.yaml

      - name: Install cert-manager
        shell: bash
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml
          kubectl rollout status deployment/cert-manager -n cert-manager --timeout=300s
          kubectl rollout status deployment/cert-manager-cainjector -n cert-manager --timeout=300s
          kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=300s

      - name: Install observability
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k k8s/observability
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          install_prometheus() {
            helm upgrade --install volunteerhub-prometheus prometheus-community/kube-prometheus-stack \
              --namespace observability \
              --create-namespace \
              -f k8s/observability/values-prometheus.yaml \
              --wait \
              --timeout 10m
          }

          if ! install_prometheus; then
            echo "Prometheus Helm release may be locked by an interrupted operation. Cleaning pending release metadata and retrying once."
            kubectl get secret -n observability -l owner=helm,name=volunteerhub-prometheus -o name \
              | xargs -r kubectl delete -n observability
            install_prometheus
          fi

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod-lite

      - name: Wait for TLS certificate
        shell: bash
        run: |
          set +e
          for _ in {1..30}; do
            kubectl get certificate volunteerhub-tls -n volunteerhub >/dev/null 2>&1 && break
            sleep 10
          done
          kubectl wait certificate/volunteerhub-tls -n volunteerhub --for=condition=Ready --timeout=10m
          status=$?
          if [ "$status" -ne 0 ]; then
            kubectl describe certificate volunteerhub-tls -n volunteerhub || true
            kubectl describe challenge -n volunteerhub || true
            kubectl get events -n volunteerhub --sort-by=.lastTimestamp | tail -n 80 || true
          fi
          exit "$status"

      - name: Apply runtime secrets
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          AUTH_PUBLIC_KEY_BASE64: ${{ secrets.AUTH_PUBLIC_KEY_BASE64 }}
          AUTH_PRIVATE_KEY_BASE64: ${{ secrets.AUTH_PRIVATE_KEY_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FCM_ENABLED: ${{ secrets.FCM_ENABLED }}
        run: |
          set -euo pipefail
          kubectl create namespace volunteerhub --dry-run=client -o yaml | kubectl apply -f -

          required=(
            POSTGRES_PASSWORD
            REDIS_PASSWORD
            RABBITMQ_DEFAULT_PASS
            CLIENT_ID
            CLIENT_SECRET
            VAPID_PUBLIC_KEY
            VAPID_PRIVATE_KEY
            AUTH_PUBLIC_KEY_BASE64
            AUTH_PRIVATE_KEY_BASE64
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret ${name} is empty or missing."
              exit 1
            fi
          done

          kubectl create secret generic volunteerhub-secrets \
            -n volunteerhub \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=REDIS_PASSWORD="${REDIS_PASSWORD}" \
            --from-literal=RABBITMQ_DEFAULT_PASS="${RABBITMQ_DEFAULT_PASS}" \
            --from-literal=CLIENT_ID="${CLIENT_ID}" \
            --from-literal=CLIENT_SECRET="${CLIENT_SECRET}" \
            --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
            --from-literal=VAPID_PUBLIC_KEY="${VAPID_PUBLIC_KEY}" \
            --from-literal=VAPID_PRIVATE_KEY="${VAPID_PRIVATE_KEY}" \
            --from-literal=AUTH_PUBLIC_KEY_BASE64="${AUTH_PUBLIC_KEY_BASE64}" \
            --from-literal=AUTH_PRIVATE_KEY_BASE64="${AUTH_PRIVATE_KEY_BASE64}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic volunteerhub-firebase \
            -n volunteerhub \
            --from-literal=FIREBASE_SERVICE_ACCOUNT_BASE64="${FIREBASE_SERVICE_ACCOUNT_BASE64}" \
            --from-literal=FCM_ENABLED="${FCM_ENABLED:-false}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl get secret volunteerhub-secrets -n volunteerhub -o jsonpath='{.data}' | jq 'keys'

      - name: Restart deployments after secret update
        run: kubectl rollout restart deployment -n volunteerhub

      - name: Wait for rollout
        shell: bash
        run: |
          set +e
          deployments=(
            service-discovery
            authorization-server
            api-gateway
            user-service
            event-service
            community-service
            registration-service
            notification-service
            chat-service
            aggregation-service
            analytic-service
            frontend
          )

          failed=0
          for deployment in "${deployments[@]}"; do
            kubectl rollout status "deployment/${deployment}" -n volunteerhub --timeout=600s
            status=$?
            if [ "$status" -ne 0 ]; then
              failed=1
              echo "::group::Diagnostics for ${deployment}"
              kubectl get pods -n volunteerhub -o wide
              kubectl describe "deployment/${deployment}" -n volunteerhub || true
              kubectl get events -n volunteerhub --sort-by=.lastTimestamp | tail -n 80 || true
              selector="$(kubectl get "deployment/${deployment}" -n volunteerhub -o jsonpath='{.spec.selector.matchLabels.app\.kubernetes\.io/name}' 2>/dev/null)"
              if [ -n "$selector" ]; then
                kubectl logs -n volunteerhub -l "app.kubernetes.io/name=${selector}" --all-containers --tail=200 || true
              fi
              echo "::endgroup::"
              break
            fi
          done

          exit "$failed"

      - name: Smoke test
        shell: bash
        run: |
          PUBLIC_BASE_URL="${{ vars.PUBLIC_BASE_URL }}"
          if [ -z "$PUBLIC_BASE_URL" ]; then
            PUBLIC_BASE_URL="http://${{ secrets.VM_HOST }}"
          fi
          curl -fsSI --retry 8 --retry-delay 10 --retry-all-errors "$PUBLIC_BASE_URL"
