apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: volunteerhub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "__APP_HOST__"
      secretName: volunteerhub-tls
  rules:
    - host: "__APP_HOST__"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
