      labels:
        app.kubernetes.io/name: authorization-server
        app.kubernetes.io/part-of: volunteerhub
    spec:
      containers:
        - name: authorization-server
          image: localhost:5000/volunteerhub/authorization-server:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7070
          envFrom:
            - configMapRef:
                name: volunteerhub-config
            - secretRef:
                name: volunteerhub-secrets
          env:
            - name: PORT
              value: "7070"
            - name: SPRING_APPLICATION_NAME
              value: AuthorizationServer
            - name: POSTGRES_HOST
