apiVersion: v1
kind: Service
metadata:
  name: service-discovery
  labels:
    app.kubernetes.io/name: service-discovery
    app.kubernetes.io/part-of: volunteerhub
    metrics.volunteerhub.io/scrape: "true"
spec:
  type: NodePort
  ports:
    - name: http
      port: 8761
      targetPort: 8761
      nodePort: 30876
  selector:
    app.kubernetes.io/name: service-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-discovery
  labels:
    app.kubernetes.io/name: service-discovery
    app.kubernetes.io/part-of: volunteerhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-discovery
        app.kubernetes.io/part-of: volunteerhub
    spec:
      containers:
        - name: service-discovery
          image: localhost:5000/volunteerhub/service-discovery:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8761
          envFrom:
            - configMapRef:
                name: volunteerhub-config
            - secretRef:
                name: volunteerhub-secrets
          env:
            - name: PORT
              value: "8761"
            - name: SPRING_APPLICATION_NAME
              value: ServiceDiscovery
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
