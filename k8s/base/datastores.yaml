apiVersion: v1
kind: Service
metadata:
  name: authorization-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: authorization-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authorization-postgres
spec:
  serviceName: authorization-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authorization-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authorization-postgres
        app.kubernetes.io/part-of: volunteerhub
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: users
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: volunteerhub-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: volunteerhub-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
