spring:
  application:
    name: NotificationService
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: ${HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL}

server:
  port: ${PORT}

vapid:
  public:
    key: ${VAPID_PUBLIC_KEY:YOUR_PUBLIC_KEY_HERE}
  private:
    key: ${VAPID_PRIVATE_KEY:YOUR_PRIVATE_KEY_HERE}
  subject: ${VAPID_SUBJECT:mailto:admin@yourcompany.com}

firebase:
  enabled: ${FCM_ENABLED:true}
  credentials:
    location: ${FIREBASE_CREDENTIALS_LOCATION:classpath:firebase-admin.json}
    base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
